# Edits a release's post in the changelog channel to match its notes in
# CHANGELOG.md as they are now (tools/discord_feeds.py release-edit). Run by
# hand from the Actions tab with the release's tag and the ID of its text
# message (the one under the card).
name: Edit a release's Discord post

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v0.3.16)"
        required: true
      message_id:
        description: "The ID of the release's text message in Discord"
        required: true

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # the lines between "## <version>" and the next "## " heading, as release.yml takes them
          awk -v heading="## ${TAG#v}" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes for $TAG" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edit the post
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ inputs.tag }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: python3 tools/discord_feeds.py release-edit "$TAG" notes.md "$MESSAGE_ID"
