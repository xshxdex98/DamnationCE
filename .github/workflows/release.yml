name: Release

# A release of every platform, made when a tag v<VERSION> is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must be VERSION's. build.yml makes the release builds, versioned
# and zipped as the game's updater names them, and this publishes them as
# the tag's release ("DamnationCE v0.1.0"). The release notes are that
# version's section of CHANGELOG.md, which must exist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$expected" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not VERSION's ($expected)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    # (the Android signing key's)
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      release: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Release notes
        run: |
          version="${{ needs.version.outputs.version }}"
          # the lines between "## <version>" and the next "## " heading
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: damnationce-*-release-zip
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "DamnationCE $GITHUB_REF_NAME" --notes-file notes.md

      # (the changelog channel's post; none without its webhook, as in a fork)
      - name: Post to Discord
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_RELEASES_WEBHOOK" ]; then
            python3 tools/discord_feeds.py release "$GITHUB_REF_NAME" notes.md release/*.zip
          fi
