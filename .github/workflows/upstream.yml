name: Upstream builds

# OpenCE's builds (OpenCommunityEdition/OpenCE, tagged build-<n>) merged
# into main with no one at the keyboard, every 15 minutes, and told of in
# Discord's upstream channel. For the newest build main doesn't have yet:
#
# - if it merges without conflicts: the merge goes on the branch
#   upstream/build-<n> with a pull request, and is built on every platform
#   with the tests (build.yml). Built, and main where it was when the merge
#   was made (else what was built isn't what would be merged; the next run
#   tries again), the pull request is merged into main and main's build
#   offers it to players (build.yml's publish). Not built, the pull request
#   stays open with the run named, and main is left as it was.
# - if it conflicts, but every commit it brings is DamnationCE's own coming
#   back (the same title is on main) or a network version main is at or
#   past: main's side is kept, so the merge changes nothing and only
#   records the build as merged.
# - if it conflicts otherwise: an issue naming the files, for a merge by
#   hand. Nothing reaches main.
#
# An OpenCE network version bump merged cleanly would leave this client's
# own range of versions it joins (HALO_PORT_NETWORK_VERSION_MINIMUM and
# _MAXIMUM, which OpenCE hasn't) behind it, so the range is moved to the
# new version in the merge, as by hand (test_linux_port.py checks it).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    # (the four platforms' build, waited for, twice)
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/OpenCommunityEdition/OpenCE.git
      LIMITS: port/linux/include/halo_port_limits.h
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the newest build
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet "$UPSTREAM" "refs/tags/build-*:refs/tags/build-*"

          # the newest build (merging it brings any before it main lacks)
          build="$(git tag --list 'build-*' | sort -t- -k2 -n | tail -n 1)"
          if git merge-base --is-ancestor "$build" HEAD; then
            echo "main has every upstream build"
            exit 0
          fi
          title="Merge upstream $build"
          if [ -n "$(gh pr list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ] ||
             [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "$build is waiting already"
            exit 0
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          git log --no-merges --format=%s HEAD.."$build" > commits.txt
          base="$(git rev-parse HEAD)"
          version() { sed -n "s/^#define HALO_PORT_NETWORK_VERSION$1 \([0-9]*\)$/\1/p" "$LIMITS"; }
          our_version="$(version '')"

          branch="upstream/$build"
          git switch --quiet -c "$branch"
          if git merge --no-ff --no-edit "$build" -m "$title"; then
            # (OpenCE's version bump: this client's range moved to it)
            new_version="$(version '')"
            if [ "$new_version" != "$our_version" ]; then
              sed -i "s/^#define HALO_PORT_NETWORK_VERSION_MINIMUM [0-9]*$/#define HALO_PORT_NETWORK_VERSION_MINIMUM $new_version/;
                      s/^#define HALO_PORT_NETWORK_VERSION_MAXIMUM [0-9]*$/#define HALO_PORT_NETWORK_VERSION_MAXIMUM $new_version/" "$LIMITS"
              git commit --quiet --amend --no-edit "$LIMITS"
            fi
            git push --quiet origin "$branch"
            gh pr create --head "$branch" --base main --title "$title" --body \
              "OpenCE's [$build](https://github.com/OpenCommunityEdition/OpenCE/releases/tag/$build) merged into main without conflicts. It's merged into main by itself once it builds on every platform with the tests."
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
          git merge --abort
          git switch --quiet main
          # (every commit DamnationCE's own coming back, or a network version
          # main has: main kept)
          ours=true
          for commit in $(git log --no-merges --format=%H HEAD.."$build"); do
            subject="$(git log -1 --format=%s "$commit")"
            # (one of DamnationCE's: its author and title both on main)
            if git log --format='%ae %s' HEAD | grep -Fxq -- "$(git log -1 --format='%ae %s' "$commit")"; then
              continue
            fi
            if [[ "$subject" =~ ^Network\ version\ ([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -le "$our_version" ]; then
              continue
            fi
            ours=false
            break
          done
          if $ours; then
            git merge --quiet -s ours --no-edit "$build" -m "$title" \
              -m "Every commit it brings is DamnationCE's own (on main already) or a network version main has, so main's side is kept and the merge changes nothing."
            git push --quiet origin HEAD:main
            echo "status=ours" >> "$GITHUB_OUTPUT"
          else
            gh issue create --title "$title" --body \
              "OpenCE's [$build](https://github.com/OpenCommunityEdition/OpenCE/releases/tag/$build) conflicts with main, so it needs a merge by hand. The conflicting files: $conflicts"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "details=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Build it, and merge it if it builds
        id: built
        if: steps.merge.outputs.branch != ''
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          BASE: ${{ steps.merge.outputs.base }}
        run: |
          # waits for the newest run of build.yml on a ref started by hand
          # (a pull request or merge this workflow makes starts none itself)
          build_and_wait() {
            gh workflow run build.yml --ref "$1" "${@:2}"
            run=""
            for attempt in $(seq 30); do
              sleep 10
              run="$(gh run list --workflow build.yml --branch "$1" --event workflow_dispatch --limit 1 \
                --json databaseId,createdAt --jq ".[] | select(.createdAt > \"$started\") | .databaseId")"
              [ -n "$run" ] && break
            done
            [ -n "$run" ] && gh run watch "$run" --interval 30 --exit-status > /dev/null
          }
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! build_and_wait "$BRANCH"; then
            details="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            gh pr comment "$BRANCH" --body "Its build failed ($details), so it wasn't merged."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "details=$details" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # (what was built is the merge onto main as it was: main moved
          # since, the pull request waits for the next run)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" != "$BASE" ]; then
            gh pr close "$BRANCH" --delete-branch --comment "Main changed while it was built, so it wasn't merged; the next run tries again."
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --delete-branch
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if build_and_wait main -f publish=true; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "status=unpublished" >> "$GITHUB_OUTPUT"
            echo "details=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.merge.outputs.status != '' || steps.built.outputs.status != ''
        with:
          python-version: "3.12"

      # (the upstream channel's post; none without its webhook, as in a fork)
      - name: Post to Discord
        if: steps.merge.outputs.status != '' || steps.built.outputs.status != ''
        env:
          DISCORD_UPSTREAM_WEBHOOK: ${{ secrets.DISCORD_UPSTREAM_WEBHOOK }}
          BUILD: ${{ steps.merge.outputs.build }}
          STATUS: ${{ steps.built.outputs.status || steps.merge.outputs.status }}
          DETAILS: ${{ steps.built.outputs.details || steps.merge.outputs.details }}
        run: |
          if [ -n "$DISCORD_UPSTREAM_WEBHOOK" ]; then
            pip install --quiet pillow
            python3 tools/discord_feeds.py upstream "$BUILD" "$STATUS" commits.txt "$DETAILS"
          fi
