name: Upstream builds

# OpenCE's builds (OpenCommunityEdition/OpenCE, tagged build-<n>) merged
# into main without anyone at the keyboard, every six hours. For the newest
# build main doesn't have yet:
#
# - if it merges without conflicts, the merge goes on the branch
#   upstream/build-<n> with a pull request "Merge upstream build-<n>", and
#   is built on every platform (build.yml, its tests with it). Built, the
#   pull request is merged into main; not, it stays open with the run
#   named, for a look by hand.
# - if it conflicts, an issue naming the files, for a merge by hand (the
#   network version, both themes' menus and the co-op code are this
#   client's own, and a conflict there needs a person).
#
# Either is done once a build. A merge this workflow makes reaches main but
# not players: its push starts no build (a workflow's own token starts
# none), so the update channel (build.yml's publish-latest) offers it with
# the next push to main by hand, or the next release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    # (the four platforms' build, waited for)
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://github.com/OpenCommunityEdition/OpenCE.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the newest build
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet "$UPSTREAM" "refs/tags/build-*:refs/tags/build-*"

          # the newest build (merging it brings any before it main lacks)
          build="$(git tag --list 'build-*' | sort -t- -k2 -n | tail -n 1)"
          if git merge-base --is-ancestor "$build" HEAD; then
            echo "main has every upstream build"
            exit 0
          fi
          title="Merge upstream $build"
          if [ -n "$(gh pr list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ] ||
             [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "$build has been taken already"
            exit 0
          fi

          branch="upstream/$build"
          git switch --quiet -c "$branch"
          if git merge --no-ff --no-edit "$build" -m "$title"; then
            git push --quiet origin "$branch"
            gh pr create --head "$branch" --base main --title "$title" --body \
              "OpenCE's [$build](https://github.com/OpenCommunityEdition/OpenCE/releases/tag/$build) merged into main without conflicts. It's merged into main by itself once it builds on every platform."
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
            git merge --abort
            gh issue create --title "$title" --body \
              "OpenCE's [$build](https://github.com/OpenCommunityEdition/OpenCE/releases/tag/$build) conflicts with main, so it needs a merge by hand. The conflicting files:

          $conflicts"
          fi

      - name: Build it, and merge it if it builds
        if: steps.merge.outputs.branch != ''
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          # (a pull request this workflow opens starts no build by itself)
          gh workflow run build.yml --ref "$BRANCH"
          run=""
          for attempt in $(seq 30); do
            sleep 10
            run="$(gh run list --workflow build.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
            [ -n "$run" ] && break
          done
          if [ -z "$run" ]; then
            gh pr comment "$BRANCH" --body "Its build didn't start, so it wasn't merged."
            exit 1
          fi
          if gh run watch "$run" --interval 30 --exit-status > /dev/null; then
            gh pr merge "$BRANCH" --merge --delete-branch
          else
            gh pr comment "$BRANCH" --body \
              "Its build failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run), so it wasn't merged."
            exit 1
          fi
