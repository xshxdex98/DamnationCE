name: Build

# Debug and release builds of the native ports (Linux, Windows, Android,
# macOS) for
# every pushed commit and pull request, uploaded as artifacts: whether a
# change builds. tools/ci_build.py does each build; see it for the options.
#
# These builds are VERSION's -dev, and never look for updates, but for a
# push to main: its builds are VERSION+<commit>, and its Windows and Linux
# release builds are published as the "latest" pre-release (publish-latest),
# replacing the last push's. Builds of main offer each newer one when the
# game starts (port/linux/src/updater.c). A release is this workflow called
# by release.yml (a tag v<VERSION> pushed): then only the release builds are
# made, versioned, and zipped as the updater names them
# (damnationce-<platform>-release.zip).
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle)
#   are cached too;
# - a newer push to the same branch cancels a run still going;
# - pushes that only change documentation do not build;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - artifacts are kept for three days.
on:
  push:
    # (a tag is a release: release.yml builds it)
    branches: ["**"]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      publish:
        # (upstream.yml, after merging an OpenCE build into main: offered to
        # players as a push to main is)
        description: "Offer this build of main to players as the latest build"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release:
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  # (tools/version.py: empty unless release.yml calls this)
  HALO_VERSION: ${{ inputs.version }}
  HALO_RELEASE_BUILD: ${{ inputs.release && '1' || '' }}
  # (a push to main: its builds offer newer pushes; tools/version.py)
  HALO_UPDATE_CHANNEL: ${{ (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/main' && 'latest' || '' }}
  HALO_BUILD_COMMIT: ${{ github.sha }}
  # (Android's version code: each build must be higher than the one it
  # installs over)
  HALO_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  linux:
    # Arch Linux has what the build needs as packages: clang 22 (for the
    # profile-guided optimisation in pgo/) and 32-bit SDL 3.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git zstd python python-pytest ninja ccache \
            clang lld gcc lib32-glibc lib32-gcc-libs lib32-sdl3

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Debug
        if: ${{ !inputs.release }}
        run: python tools/ci_build.py linux debug

      - name: Release
        run: python tools/ci_build.py linux release

      - name: Test
        run: |
          python -m pytest -q tools/test_linux_port.py tools/harness
          python tools/test_light_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: damnationce-linux-debug
          path: dist/damnationce-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: damnationce-linux-release
          path: dist/damnationce-linux-release
          retention-days: 3

      - name: Zip for the release
        if: ${{ inputs.release || env.HALO_UPDATE_CHANNEL == 'latest' }}
        run: python -c "import shutil; shutil.make_archive('damnationce-linux-release', 'zip', 'dist/damnationce-linux-release')"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release || env.HALO_UPDATE_CHANNEL == 'latest' }}
        with:
          name: damnationce-linux-release-zip
          path: damnationce-linux-release.zip
          retention-days: 3

  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # The app's signing key, from the repository's secrets: ANDROID_KEYSTORE
      # (the keystore, in base64) and ANDROID_KEYSTORE_PASSWORD (its and its
      # key's password; the key's alias is halo). Every build signed with it
      # installs over the one before; without it, the runner's own debug key
      # signs, and a build installs only fresh.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          fi

      - name: Debug
        if: ${{ !inputs.release }}
        run: python3 tools/ci_build.py android debug

      - name: Release
        run: python3 tools/ci_build.py android release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: damnationce-android-debug
          path: dist/damnationce-android-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: damnationce-android-release
          path: dist/damnationce-android-release
          retention-days: 3

      - name: Zip for the release
        if: ${{ inputs.release }}
        run: python3 -c "import shutil; shutil.make_archive('damnationce-android-release', 'zip', 'dist/damnationce-android-release')"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: damnationce-android-release-zip
          path: damnationce-android-release.zip
          retention-days: 3

  windows:
    # The runner image has LLVM, Python and Visual Studio's x86 libraries and
    # Windows SDK.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # SDL's development package, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Debug
        if: ${{ !inputs.release }}
        run: python tools/ci_build.py windows debug

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Test light storage
        run: python tools/test_light_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: damnationce-windows-debug
          path: dist/damnationce-windows-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: damnationce-windows-release
          path: dist/damnationce-windows-release
          retention-days: 3

      - name: Zip for the release
        if: ${{ inputs.release || env.HALO_UPDATE_CHANNEL == 'latest' }}
        run: python -c "import shutil; shutil.make_archive('damnationce-windows-release', 'zip', 'dist/damnationce-windows-release')"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release || env.HALO_UPDATE_CHANNEL == 'latest' }}
        with:
          name: damnationce-windows-release-zip
          path: damnationce-windows-release.zip
          retention-days: 3

  macos:
    # Apple silicon, with Xcode's clang: the universal application (Apple
    # silicon and Intel, self-contained: tools/macos_build.py, --portable),
    # with its own SDL3, built once and cached. The application goes up as
    # a tar, which keeps its symbolic links and permissions (its signature
    # needs them).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install the toolchain
        run: brew install ninja ccache

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - uses: actions/cache@v4
        with:
          path: build/macos/third_party
          key: macos-sdl3-${{ hashFiles('tools/android_build.py', 'tools/macos_build.py') }}

      - name: Debug
        if: ${{ !inputs.release }}
        run: python3 tools/ci_build.py macos debug

      - name: Release
        run: python3 tools/ci_build.py macos release

      - name: Package
        run: |
          if [ -d dist/damnationce-macos-debug ]; then
            tar -C dist -cf damnationce-macos-debug.tar damnationce-macos-debug
          fi
          tar -C dist -cf damnationce-macos-release.tar damnationce-macos-release

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: damnationce-macos-debug
          path: damnationce-macos-debug.tar
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: damnationce-macos-release
          path: damnationce-macos-release.tar
          retention-days: 3

      # (ditto keeps the application's symbolic links, which its signature needs)
      - name: Zip for the release
        if: ${{ inputs.release }}
        run: ditto -c -k --sequesterRsrc dist/damnationce-macos-release damnationce-macos-release.zip

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: damnationce-macos-release-zip
          path: damnationce-macos-release.zip
          retention-days: 3

  # A push to main: its Windows and Linux release builds become the "latest"
  # pre-release (the last push's goes), which builds of main offer to
  # update to (port/linux/src/updater.c). The release is pointed at the
  # commit, which is how the game tells whether it has it.
  publish-latest:
    if: ${{ (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/main' }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: damnationce-*-release-zip
          path: latest
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l latest
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest latest/*.zip --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "DamnationCE latest build" \
            --notes "The newest build of main, from ${GITHUB_SHA::7}. Builds of main offer it when they start."
