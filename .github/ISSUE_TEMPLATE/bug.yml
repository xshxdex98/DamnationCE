name: Bug report
description: Something in DamnationCE doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One bug per issue, please: each gets its own fix. DamnationCE never provides game files, so please don't attach maps or disc images.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux, Steam Deck, Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you're on (for example v0.3.22), or "latest build" and its date.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: What you were playing, and whether you hosted.
      options: [Single player, Co-op (host), Co-op (joined), Multiplayer (host), Multiplayer (joined), Level editor, Menus]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Crash, Co-op, Multiplayer, Online Games list, Custom Edition maps, Campaign, Level editor, Menus, Controls, Graphics, Sound, Other]
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map
      description: The map's name (for a Custom Edition map, its file name), if it happened on one.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to get there, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach debug.txt from the game's folder (for a crash, with halo.pdb beside halo.exe, so the log names where it crashed), and on macOS the crash report from ~/Library/Logs/DiagnosticReports (halo-*.ips). In co-op or multiplayer, the host's debug.txt helps too.
